[project]
name = "cobox"
version = "0.1.0"
description = ""
authors = [{ name = "Pere Rossello", email = "pere.rossello@iac.es" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.6",
    "numpyro>=0.15",
    "equinox>=0.11",
    "pydantic>=2",
    "h5py>=3",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
nufft = ["jax-finufft>=1.3"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poetry]
packages = [
    { include = "cobox", from = "src" },
    { include = "colcdm", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
