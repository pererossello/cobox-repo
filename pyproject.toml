[project]
name = "cobox"
version = "0.2.0"
description = "JAX tools for cosmological fields, spectra and catalogues"
authors = [{ name = "Pere Rossello", email = "pere.rossello@iac.es" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.6",
    "numpyro>=0.15",
    "equinox>=0.11",
    "numpy>=2.0",
    "h5py>=3",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
sphere = ["s2fft>=1.4.0"]
nufft = ["jax-finufft>=1.3"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n 4"

[tool.poetry]
packages = [
    { include = "cobox", from = "src" },
    { include = "colcdm", from = "src" },
    { include = "cosphere", from = "src" },
    { include = "cozcat", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-xdist = ">=3"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
